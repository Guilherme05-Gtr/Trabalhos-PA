<script>
    var I =parseInt(prompt("digite a idade"))
    switch(I){
        case 1:
        case 2:
        case 3:
        case 4:
        case 5:
        case 6:
            alert('Voce é dente de leite')
            break;
        case 7: 
            alert('Voce é junior')
            break;
        case 8:
            alert('Voce é junior max')
            break;
        case 9: 
            alert('Voce é junior master')
            break;
        case 10:
            alert('Voce é master')
        case 0:
        default:
            alert('Idade incorreta')
    }
</script>
