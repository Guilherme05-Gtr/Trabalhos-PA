<script>

    let VetorA = [];

    for (let i = 0; i < 10; i++) {
        VetorA[i] = Number(prompt("Digite um número:"));
    }

    let maior = VetorA[0];
    let menor = VetorA[0];

    for (let i = 0; i < 10; i++) {
        if (VetorA[i] > maior) maior = VetorA[i];
        if (VetorA[i] < menor) menor = VetorA[i];
    }

    alert("Maior: " + maior);
    alert("Menor: " + menor);

</script>
